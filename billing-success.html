<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — MoonCanvas</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/png" href="./moon-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <style>
    .success-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .success-card {
      max-width: 480px;
      background: var(--surface, #1a1a2e);
      border: 1px solid var(--border, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 3rem 2rem;
    }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
    }
    .success-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-primary, #fff);
    }
    .success-sub {
      color: var(--text-secondary, rgba(255,255,255,0.6));
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .success-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="mc"><circle cx="20" cy="20" r="18.5"/></clipPath></defs><image href="./moon-icon.png" x="1" y="1" width="38" height="38" clip-path="url(#mc)" preserveAspectRatio="xMidYMid slice"/></svg>
    </span>
    <span class="brand-name">MoonCanvas</span>
  </a>
</header>

<main class="success-page">
  <div class="success-card">
    <div class="success-icon">🌙</div>
    <h1 class="success-title">Welcome aboard!</h1>
    <p class="success-sub">Your subscription is active. Credits have been added to your account — head to your dashboard to start generating videos.</p>
    <div class="success-actions">
      <a href="/dashboard.html" class="button primary">Go to Dashboard</a>
      <a href="/playground.html" class="button ghost">Try Playground</a>
    </div>
  </div>
</main>

<script src="./auth.js" defer></script>
</body>
</html>
